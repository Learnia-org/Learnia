<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnia | Top Mentores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlue: '#2C3E50', terracota: '#D35400',
                        natureGreen: '#27AE60', eduCian: '#2980B9', solarYellow: '#F1C40F'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fcfdfd; background-image: radial-gradient(#2980B910 1px, transparent 1px); background-size: 30px 30px; }
        .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .podio-1 { background: linear-gradient(135deg, #F1C40F, #f5d76e); }
        .podio-2 { background: linear-gradient(135deg, #B0BEC5, #CFD8DC); }
        .podio-3 { background: linear-gradient(135deg, #D35400, #e67e22); }
    </style>
</head>
<body class="font-sans text-deepBlue antialiased">

<nav class="bg-white/80 backdrop-blur-md px-8 py-4 flex justify-between items-center sticky top-0 z-50 border-b border-slate-100 shadow-sm">
    <div class="flex items-center space-x-4">
        <a th:href="@{/menu}" class="w-10 h-10 flex items-center justify-center rounded-xl border border-slate-200 hover:bg-slate-50 transition">
            <i class="fa-solid fa-arrow-left text-deepBlue"></i>
        </a>
        <div class="text-2xl font-black tracking-tighter text-deepBlue">LEAR<span class="text-eduCian">NIA</span></div>
    </div>
    <div class="flex items-center space-x-4">
        <a th:href="@{/usuario}">
            <img th:src="${usuario.fotoUsuario != null and !#strings.isEmpty(usuario.fotoUsuario) ? usuario.fotoUsuario : '/img/default-avatar.png'}"
                 class="w-9 h-9 rounded-xl object-cover border-2 border-slate-100" alt="Foto de perfil">
        </a>
        <span class="text-sm font-bold text-deepBlue hidden md:block" th:text="${usuario.nombreUsuario}">Usuario</span>
    </div>
</nav>

<main class="max-w-4xl mx-auto p-6 space-y-8">

    <div class="text-center space-y-3 py-6">
        <div class="inline-flex items-center space-x-2 px-5 py-2 bg-solarYellow/10 rounded-full text-solarYellow text-[10px] font-black uppercase tracking-widest border border-solarYellow/20">
            <i class="fa-solid fa-trophy"></i>
            <span>Comunidad</span>
        </div>
        <h1 class="text-4xl font-black tracking-tighter text-deepBlue">Top <span class="text-solarYellow italic">Mentores</span></h1>
        <p class="text-slate-400 font-medium">Los estudiantes que más ayudan a la comunidad de Learnia.</p>
    </div>

    <div th:if="${#lists.isEmpty(mentores)}" class="bg-white p-12 rounded-3xl border border-slate-100 text-center">
        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl text-slate-200">
            <i class="fa-solid fa-people-group"></i>
        </div>
        <h4 class="font-black text-deepBlue mb-1">Aún no hay mentores</h4>
        <p class="text-slate-400 text-sm">¡Responde una duda y sé el primero en el ranking!</p>
    </div>

    <div th:if="${!#lists.isEmpty(mentores)}" class="space-y-3">
        <div th:each="mentor, iter : ${mentores}"
             class="glass-card rounded-3xl p-5 flex items-center gap-5 shadow-sm hover:shadow-md transition-all"
             th:classappend="${iter.index == 0} ? 'border-2 border-solarYellow' : ''">

            <div class="w-11 h-11 rounded-2xl flex items-center justify-center font-black text-white text-sm shrink-0"
                 th:classappend="${iter.index == 0} ? 'podio-1' : (${iter.index == 1} ? 'podio-2' : (${iter.index == 2} ? 'podio-3' : 'bg-slate-200 text-slate-500'))"
                 th:text="${iter.index + 1}">1</div>

            <img th:src="${mentor.usuario().fotoUsuario != null and !#strings.isEmpty(mentor.usuario().fotoUsuario) ? mentor.usuario().fotoUsuario : '/img/default-avatar.png'}"
                 class="w-12 h-12 rounded-2xl object-cover border border-slate-100 shrink-0" alt="Avatar">

            <div class="flex-1 min-w-0">
                <p class="font-black text-deepBlue truncate" th:text="${mentor.usuario().nombreUsuario}">Usuario</p>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                    <span th:text="${mentor.totalRespuestas()}">0</span> respuestas ·
                    <span th:text="${mentor.totalLikes()}">0</span> likes
                </p>
            </div>

            <div class="text-right shrink-0">
                <div class="text-xl font-black text-eduCian" th:text="${mentor.puntaje()}">0</div>
                <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Puntos</div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/chatbot :: chatbot}"></div>
<div th:replace="~{fragments/darkmode :: darkmode}"></div>
</body>
</html>
