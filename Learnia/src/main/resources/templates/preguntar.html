<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnia | Hacer pregunta</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlue: '#2C3E50',
                        terracota: '#D35400',
                        natureGreen: '#27AE60',
                        eduCian: '#2980B9',
                        solarYellow: '#F1C40F'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .mic-btn { transition: all 0.15s ease; }
        .mic-btn.recording { background-color: #D35400 !important; color: #fff !important; animation: pulseMic 1s infinite; }
        @keyframes pulseMic { 0%,100% { box-shadow: 0 0 0 0 rgba(211,84,0,0.5); } 50% { box-shadow: 0 0 0 6px rgba(211,84,0,0); } }
        .field-wrap { position: relative; }
    </style>
</head>
<body class="font-sans text-deepBlue bg-gray-50">

<nav class="bg-white px-8 py-4 border-b shadow-sm flex justify-between items-center">
    <div class="text-2xl font-black">LEAR<span class="text-eduCian">NIA</span></div>
    <a th:href="@{/menu}" class="text-sm font-bold text-gray-500 hover:text-eduCian transition-colors">← Volver al menú</a>
</nav>

<main class="max-w-3xl mx-auto p-8">

    <div class="bg-white p-8 rounded-3xl shadow-lg border border-gray-200">

        <h1 class="text-2xl font-black mb-2">Publicar una pregunta</h1>
        <p class="text-gray-500 text-sm mb-6">Tu pregunta será visible en la comunidad de Learnia.</p>

        <div th:if="${error}" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm font-medium"
             th:text="${error}">
        </div>

        <form th:action="@{/preguntar}" th:object="${preguntaDTO}" method="post" class="space-y-6">

            <div>
                <label class="text-sm font-bold">Título <span class="text-red-400">*</span></label>
                <div class="field-wrap mt-2">
                    <input type="text" th:field="*{titulo}" id="input-titulo"
                           class="w-full p-3 pr-12 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-eduCian focus:border-transparent"
                           placeholder="Escribe tu pregunta (mínimo 15 caracteres)" required minlength="15">
                    <button type="button" id="mic-titulo" title="Dictar por voz"
                            class="mic-btn absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-eduCian hover:text-white flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xs"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="text-sm font-bold">Descripción <span class="text-red-400">*</span></label>
                <div class="field-wrap mt-2">
                    <textarea th:field="*{descripcion}" id="input-descripcion"
                              rows="6"
                              class="w-full p-3 pr-12 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-eduCian focus:border-transparent"
                              placeholder="Explica tu duda con detalle (mínimo 20 caracteres)" required minlength="20"></textarea>
                    <button type="button" id="mic-descripcion" title="Dictar por voz"
                            class="mic-btn absolute right-2 top-2 w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-eduCian hover:text-white flex items-center justify-center">
                        <i class="fa-solid fa-microphone text-xs"></i>
                    </button>
                </div>

                <div id="similares-box" class="hidden mt-3 p-4 bg-solarYellow/10 border border-solarYellow/30 rounded-2xl">
                    <p class="text-xs font-black text-deepBlue mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-solarYellow"></i>
                        ¿Ya existe algo parecido? Mira esto antes de publicar:
                    </p>
                    <ul id="similares-lista" class="space-y-1"></ul>
                </div>
            </div>

            <div>
                <label class="text-sm font-bold">Categoría <span class="text-red-400">*</span></label>
                <select th:field="*{idCategoria}" class="w-full mt-2 p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-eduCian focus:border-transparent bg-white" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option th:each="cat : ${categorias}"
                            th:value="${cat.idCategoria}"
                            th:text="${cat.nombreCategoria}">
                    </option>
                </select>
            </div>

            <div>
                <button type="submit"
                        class="w-full bg-terracota text-white py-3 rounded-2xl font-bold hover:bg-orange-600 transition-colors shadow-md hover:shadow-lg active:scale-95">
                    Publicar pregunta
                </button>
            </div>

        </form>
    </div>

</main>

<script>
    const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;

    function habilitarDictado(botonId, campoId, esTextarea) {
        const btn = document.getElementById(botonId);
        const campo = document.getElementById(campoId);
        if (!btn || !campo) return;

        if (!SpeechRecognitionImpl) {
            btn.style.display = 'none';
            return;
        }

        const recognizer = new SpeechRecognitionImpl();
        recognizer.lang = 'es-ES';
        recognizer.interimResults = false;
        let escuchando = false;

        recognizer.onresult = (event) => {
            const texto = event.results[0][0].transcript;
            campo.value = (campo.value ? campo.value + ' ' : '') + texto;
            campo.dispatchEvent(new Event('input'));
        };
        recognizer.onend = () => { escuchando = false; btn.classList.remove('recording'); };
        recognizer.onerror = () => { escuchando = false; btn.classList.remove('recording'); };

        btn.addEventListener('click', () => {
            if (escuchando) { recognizer.stop(); return; }
            try {
                escuchando = true;
                btn.classList.add('recording');
                recognizer.start();
            } catch (e) {
                escuchando = false;
                btn.classList.remove('recording');
            }
        });
    }

    habilitarDictado('mic-titulo', 'input-titulo');
    habilitarDictado('mic-descripcion', 'input-descripcion');

    let debounceTimer = null;
    const descripcionEl = document.getElementById('input-descripcion');
    const tituloEl = document.getElementById('input-titulo');
    const categoriaEl = document.querySelector('select[name="idCategoria"]');
    const similaresBox = document.getElementById('similares-box');
    const similaresLista = document.getElementById('similares-lista');

    function buscarSimilares() {
        const texto = (tituloEl.value + ' ' + descripcionEl.value).trim();
        if (texto.length < 15) {
            similaresBox.classList.add('hidden');
            return;
        }
        const idCategoria = categoriaEl ? categoriaEl.value : '';
        const params = new URLSearchParams({ texto: texto });
        if (idCategoria) params.set('idCategoria', idCategoria);

        fetch('/api/preguntas/similares?' + params.toString())
            .then(r => r.ok ? r.json() : [])
            .then(data => {
                if (!data || data.length === 0) {
                    similaresBox.classList.add('hidden');
                    return;
                }
                similaresLista.innerHTML = '';
                data.forEach(p => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="/pregunta/${p.idPregunta}" target="_blank"
                        class="flex items-center gap-2 text-xs font-bold text-deepBlue hover:text-eduCian transition-colors py-1">
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400"></i>
                        ${p.titulo} <span class="text-[10px] text-slate-400 font-black uppercase">· ${p.categoria}</span>
                    </a>`;
                    similaresLista.appendChild(li);
                });
                similaresBox.classList.remove('hidden');
            })
            .catch(() => similaresBox.classList.add('hidden'));
    }

    function onCambioTexto() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(buscarSimilares, 600);
    }

    descripcionEl.addEventListener('input', onCambioTexto);
    tituloEl.addEventListener('input', onCambioTexto);
    if (categoriaEl) categoriaEl.addEventListener('change', onCambioTexto);
</script>

    <div th:replace="~{fragments/chatbot :: chatbot}"></div>
    <div th:replace="~{fragments/darkmode :: darkmode}"></div>
</body>
</html>
